[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-actor-critic-advantage-td-error-skill"
version = "1.0.0"
description = "Advantage Actor-Critic (A2C) tabular updates with TD error advantage estimation and softmax policy gradients."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AlphaPark Team", email = "engineering@alphapark.ai"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/alphaparkinc/genpark-actor-critic-advantage-td-error-skill"
Repository = "https://github.com/alphaparkinc/genpark-actor-critic-advantage-td-error-skill.git"
Issues = "https://github.com/alphaparkinc/genpark-actor-critic-advantage-td-error-skill/issues"
